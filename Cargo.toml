[package]
name = "nobilis"
version = "0.1.0"
edition = "2021"
description = "Chat daemon: IRC, Discord, Sneedchat and Matrix behind one unified JSON model over a Unix socket"
license = "AGPL-3.0-or-later"
repository = "https://git.salastil.com/Salastil/nobilis"

[[bin]]
name = "nobilis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "0.8"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
anyhow = "1"

irc = { version = "1", default-features = false, features = ["ctcp", "tls-rust", "proxy"] }
base64 = "0.22"
futures = "0.3"

# Discord backend (QR remote-auth login + gateway client)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# Pulled in transitively by both of the above, but with conflicting default
# crypto-provider features (ring vs aws-lc-rs) - direct so main.rs can pin
# one explicitly at startup (see rustls::crypto::ring::default_provider()
# there); without that, the first TLS connection panics ("Could not
# automatically determine the process-level CryptoProvider").
rustls = { version = "0.23", features = ["ring"] }
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Sneedchat backend (SockChat over embedded Tor)
arti-client = { version = "0.44", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
tor-rtcompat = { version = "0.44", features = ["tokio", "rustls"] }
tokio-socks = "0.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
hmac = "0.13"
sha1 = "0.11"
hex = "0.4"
bytes = "1"
base32 = "0.5"
url = "2"
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Matrix backend (Client-Server API over plain reqwest + full E2EE via
# matrix-sdk-crypto, the standalone vodozemac-backed Olm/Megolm state
# machine matrix-sdk itself uses - see backend/matrix/crypto.rs)
matrix-sdk-crypto = "0.18"
matrix-sdk-sqlite = { version = "0.18", default-features = false, features = ["crypto-store", "bundled"] }
# Pinned exactly to whatever matrix-sdk-crypto 0.18.0 itself resolves to
# (confirmed via `cargo tree -p matrix-sdk-crypto`) - OlmMachine's public
# API takes ruma-common types (UserId/RoomId/DeviceId) and wraps
# ruma-client-api request structs directly, and Cargo will happily
# resolve two incompatible ruma-common versions side by side without
# erroring until the specific call sites that mix them - i.e. everywhere.
ruma-common = "=0.19.0"
ruma-client-api = "=0.24.0"
ruma-events = "=0.34.0"
js_int = "=0.2.2"
# Discord voice. Standalone: no serenity or twilight gateway, since nobilis
# has its own - only the driver, which needs a websocket backend named
# explicitly, and tungstenite is what the rest of this crate already speaks.
# `receive` is what makes hearing anyone possible; it is off by default.
songbird = { version = "0.6", default-features = false, features = ["driver", "rustls", "tungstenite", "receive", "gateway"] }
