[package]
name = "nobilis"
version = "0.1.0"
edition = "2021"
description = "Chat daemon: IRC, Discord, Sneedchat and Matrix behind one unified JSON model over a Unix socket"
license = "GPL-3.0-or-later"
repository = "https://git.salastil.com/Salastil/nobilis"

[[bin]]
name = "nobilis"
path = "src/main.rs"

[dependencies]
# A larger receive buffer for the Discord voice and stream sockets, on every
# platform - see backend/discord/streamconn.rs `widen_receive_buffer`.
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
anyhow = "1"

irc = { version = "1", default-features = false, features = ["ctcp", "tls-rust", "proxy"] }
base64 = "0.22"
futures = "0.3"

# Discord backend (QR remote-auth login + gateway client)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2", "socks"] }
# Pulled in transitively by both of the above, but with conflicting default
# crypto-provider features (ring vs aws-lc-rs) - direct so main.rs can pin
# one explicitly at startup (see rustls::crypto::ring::default_provider()
# there); without that, the first TLS connection panics ("Could not
# automatically determine the process-level CryptoProvider").
rustls = { version = "0.23", features = ["ring"] }
rsa = "0.9"
sha2 = "0.10"
# The login captcha's proof of work; see backend/sneedchat/captcha.rs.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
rand = "0.8"
# Discord's own voice encryption, for the voice and Go Live connections this
# crate runs itself - see backend/discord/voicecrypto.rs.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# DAVE, Discord's end-to-end encryption for voice. Discord refuses a voice
# connection that cannot speak it (close code 4017).
davey = "0.1"
# `image` for reading Discord's login code, `svg` (a default) for drawing
# Matrix's verification one - the same crate answers both directions.
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Sneedchat backend (SneedChat over embedded Tor)
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
tor-rtcompat = { version = "0.47", features = ["tokio", "rustls"] }
tokio-socks = "0.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
hmac = "0.13"
sha1 = "0.11"
hex = "0.4"
bytes = "1"
base32 = "0.5"
url = "2"
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Matrix backend (Client-Server API over plain reqwest + full E2EE via
# matrix-sdk-crypto, the standalone vodozemac-backed Olm/Megolm state
# machine matrix-sdk itself uses - see backend/matrix/crypto.rs)
# `experimental-send-custom-to-device` is what lets a call's media keys be
# sent straight to the devices in the call, Olm-encrypted, which is how
# Element distributes them - see backend/matrix/crypto.rs.
# `qrcode` is what lets a verification be done by scanning rather than by
# reading emoji aloud - the method Element offers first and most people use.
matrix-sdk-crypto = { version = "=0.19.1", features = ["experimental-send-custom-to-device", "qrcode"] }
# Pinned to exactly what matrix-sdk-crypto 0.19 resolves to, for the same
# reason the ruma crates below are: this is where its own response types live
# - the verification state a decrypted message carries among them - and a
# version skew here is a type mismatch rather than a missing feature.
matrix-sdk-common = "=0.19.1"
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false, features = ["crypto-store", "bundled"] }
# Pinned exactly to whatever matrix-sdk-crypto 0.19.1 itself resolves to
# (confirmed via `cargo tree -p matrix-sdk-crypto`) - OlmMachine's public
# API takes ruma-common types (UserId/RoomId/DeviceId) and wraps
# ruma-client-api request structs directly, and Cargo will happily
# resolve two incompatible ruma-common versions side by side without
# erroring until the specific call sites that mix them - i.e. everywhere.
ruma-common = "=0.20.0"
ruma-client-api = "=0.25.0"
ruma-events = "=0.35.0"
js_int = "=0.2.2"
# Discord voice is this crate's own connection (backend/discord/voiceconn.rs):
# cpal for the sound devices, opus2 for the codec. Songbird carried calls until
# they needed video, which it never asks Discord for.
cpal = "0.18.2"
# The Opus codec, for calls and for recording a voice message.
opus2 = "0.4"
# Echo cancellation, noise suppression and a high-pass filter for a call's
# microphone: WebRTC's audio processing, ported to Rust, so a Discord call gets
# what Chromium gives a Matrix one without a C++ library in every build.
sonora = "0.2"
# Soundboard sounds are MP3 or Ogg Vorbis, decoded here to be mixed into a call.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis"] }

# Two calls, both in main.rs: see keep_the_heap_honest() there for why a chat
# daemon has anything to say to its allocator.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Tor's certificate validation hangs on Windows without this.
#
# saturating-time 0.5.0 (as 0.4.0 did) finds a type's limit by halving a step until the
# arithmetic fails, and only shrinks that step when it sees None. On Windows a
# SystemTime is a FILETIME with 100ns granularity, so subtracting 1ns returns
# Some(unchanged) rather than None - the None branch becomes unreachable at
# step==1ns and the search spins on one core forever. Measured: the consensus
# downloads, tor-cert goes to check the authority certificates, and the
# bootstrap never advances past 15% while burning 96% of a core.
#
# The patch treats "succeeded but did not move" as having found the limit,
# which it has. Reported upstream; drop this once a release carries the fix.
[patch.crates-io]
saturating-time = { path = "vendor/saturating-time" }
