[package]
name = "nobilis"
version = "1.5.10"
edition = "2021"
description = "Chat daemon: IRC, Discord, Sneedchat and Matrix behind one unified JSON model over a Unix socket"
license = "GPL-3.0-or-later"
repository = "https://github.com/Moho-Chat/nobilis"
authors = ["Salastil <salastil@cock.li>"]

[[bin]]
name = "nobilis"
path = "src/main.rs"

[dependencies]
# A larger receive buffer for the Discord voice and stream sockets, on every
# platform - see backend/discord/streamconn.rs `widen_receive_buffer`.
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
anyhow = "1"

irc = { version = "1", default-features = false, features = ["ctcp", "tls-rust", "proxy"] }
base64 = "0.22"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Discord backend (QR remote-auth login + gateway client)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "http2", "socks", "stream"] }
# Pulled in transitively by both of the above, but with conflicting default
# crypto-provider features (ring vs aws-lc-rs) - direct so main.rs can pin
# one explicitly at startup (see rustls::crypto::ring::default_provider()
# there); without that, the first TLS connection panics ("Could not
# automatically determine the process-level CryptoProvider").
rustls = { version = "0.23", features = ["ring"] }
rsa = "0.9"
sha2 = "0.10"
# Fluxer's ALTCHA proof of work (backend/fluxer/altcha.rs): PBKDF2-SHA256, as the server derives it.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# The login captcha's proof of work; see backend/sneedchat/captcha.rs.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
rand = "0.8"
# Discord's own voice encryption, for the voice and Go Live connections this
# crate runs itself - see backend/discord/voicecrypto.rs.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# DAVE, Discord's end-to-end encryption for voice. Discord refuses a voice
# connection that cannot speak it (close code 4017).
davey = "0.1"
# `image` for reading Discord's login code, `svg` (a default) for drawing
# Matrix's verification one - the same crate answers both directions.
qrcode = { version = "0.14", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
# The chat's emoticons and reactions are SVG, which the window will not show from a
# file (it can carry script); they are drawn to PNG here instead. No text or fonts.
resvg = { version = "0.50", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Telegram backend (MTProto, pure Rust). `grammers-session` without its default `sqlite-storage` (libsql would sit
# beside rusqlite and matrix-sdk-sqlite): the session is serialized into the account instead - see backend/telegram.
grammers-client = { version = "=0.11.0", default-features = false, features = ["proxy", "fs"] }
grammers-mtsender = { version = "=0.11.0", default-features = false, features = ["proxy"] }
grammers-session = { version = "=0.11.0", default-features = false, features = ["serde"] }
# Secret chats: the DH check and AES-IGE grammers itself uses, the big numbers for the key, MD5 for a file key's fingerprint.
grammers-crypto = "=0.11.0"
num-bigint = "0.5"
md5 = "0.8"

# Signal backend (linked secondary device): presage is Whisperfish's client library over libsignal-service-rs and Signal's
# own libsignal. All AGPL-3.0, pinned to a commit (its libsignal-service-rs and libsignal pins ride with it). The store
# crate presage-store-sqlite is NOT used - it wants libsqlite3-sys 0.36 + SQLCipher, rusqlite here brings 0.38 - the Store
# trait is implemented in backend/signal/store.rs instead. No `cdsi` (BoringSSL).
presage = { git = "https://github.com/whisperfish/presage", rev = "4b81740610c301cbd54d95f4dbd4cadd692af95e", default-features = false, features = ["cdsi"] }
# Reading the message history a phone transfers to a newly linked device (Signal's backup format), at the libsignal
# version presage uses. `test-util` makes its generated protobuf types public; nothing else of it is used.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
# The library's protocol stores are async traits (`#[async_trait(?Send)]`), and its error types are thiserror 2.
async-trait = "0.1"
uuid = "1"
# The rand 0.9 generators the Signal library's group encryption takes (the daemon itself is on 0.8).
rand09 = { package = "rand", version = "0.9" }
# XMPP backend: the xmpp-rs stack (MPL-2.0, which GPLv3 can include). `ring`, not the default aws-lc-rs, so the one TLS
# provider main.rs installs is the one these use and no C compiler is needed - see backend/xmpp.
tokio-xmpp = { version = "6.0", default-features = false, features = ["ring", "starttls", "direct-tls", "rustls-native-certs"] }
xmpp-parsers = "0.23"
# Named directly because the connector in backend/xmpp/transport.rs speaks their types: the same versions the library
# already resolved.
sasl = "0.5"
rustls-native-certs = "0.8"

# Sneedchat backend (SneedChat over embedded Tor)
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression"] }
tor-rtcompat = { version = "0.47", features = ["tokio", "rustls"] }
tokio-socks = "0.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
hmac = "0.13"
sha1 = "0.11"
hex = "0.4"
bytes = "1"
url = "2"
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Steam backend: its connection managers speak protobuf inside a WebSocket,
# and compress a run of packets together as gzip - see backend/steam. The
# messages are written out by hand from Valve's own definitions, so no
# protoc is needed to build, and each is checked against bytes the real
# definitions produced.
prost = { version = "0.14", default-features = false, features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Matrix backend (Client-Server API over plain reqwest + full E2EE via
# matrix-sdk-crypto, the standalone vodozemac-backed Olm/Megolm state
# machine matrix-sdk itself uses - see backend/matrix/crypto.rs)
# `experimental-send-custom-to-device` is what lets a call's media keys be
# sent straight to the devices in the call, Olm-encrypted, which is how
# Element distributes them - see backend/matrix/crypto.rs.
# `qrcode` is what lets a verification be done by scanning rather than by
# reading emoji aloud - the method Element offers first and most people use.
matrix-sdk-crypto = { version = "=0.19.1", features = ["experimental-send-custom-to-device", "qrcode"] }
# Pinned to exactly what matrix-sdk-crypto 0.19 resolves to, for the same
# reason the ruma crates below are: this is where its own response types live
# - the verification state a decrypted message carries among them - and a
# version skew here is a type mismatch rather than a missing feature.
matrix-sdk-common = "=0.19.1"
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false, features = ["crypto-store", "bundled"] }
# Pinned exactly to whatever matrix-sdk-crypto 0.19.1 itself resolves to
# (confirmed via `cargo tree -p matrix-sdk-crypto`) - OlmMachine's public
# API takes ruma-common types (UserId/RoomId/DeviceId) and wraps
# ruma-client-api request structs directly, and Cargo will happily
# resolve two incompatible ruma-common versions side by side without
# erroring until the specific call sites that mix them - i.e. everywhere.
ruma-common = "=0.20.0"
ruma-client-api = "=0.25.0"
ruma-events = "=0.35.0"
js_int = "=0.2.2"
# Discord voice is this crate's own connection (backend/discord/voiceconn.rs):
# cpal for the sound devices, opus2 for the codec. Songbird carried calls until
# they needed video, which it never asks Discord for.
cpal = "0.18.2"
# The Opus codec, for calls and for recording a voice message.
opus2 = "0.4"
# Echo cancellation, noise suppression and a high-pass filter for a call's
# microphone: WebRTC's audio processing, ported to Rust, so a Discord call gets
# what Chromium gives a Matrix one without a C++ library in every build.
sonora = "0.2"
# Soundboard sounds are MP3 or Ogg Vorbis, decoded here to be mixed into a call.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis"] }
imagesize = "0.13"
iana-time-zone = "0.1.65"
x25519-dalek = "2"
curve25519-dalek = "4"
hkdf = "0.12"
cbc = { version = "0.1", features = ["alloc"] }
aes = "0.8"
hmac012 = { version = "0.12", package = "hmac" }
sha1_010 = { version = "0.10", package = "sha1" }
stringprep = "0.1"
hickory-resolver = "0.26"
idna = "1"
thiserror = "2"
x509-parser = { version = "0.17", default-features = false }
rqrr = "0.10"
protobuf = "3.7"

# Two calls, both in main.rs: see keep_the_heap_honest() there for why a chat
# daemon has anything to say to its allocator.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Tor's certificate validation hangs on Windows without this.
#
# saturating-time 0.5.0 (as 0.4.0 did) finds a type's limit by halving a step until the
# arithmetic fails, and only shrinks that step when it sees None. On Windows a
# SystemTime is a FILETIME with 100ns granularity, so subtracting 1ns returns
# Some(unchanged) rather than None - the None branch becomes unreachable at
# step==1ns and the search spins on one core forever. Measured: the consensus
# downloads, tor-cert goes to check the authority certificates, and the
# bootstrap never advances past 15% while burning 96% of a core.
#
# The patch treats "succeeded but did not move" as having found the limit,
# which it has. Reported upstream; drop this once a release carries the fix.
[patch.crates-io]
saturating-time = { path = "vendor/saturating-time" }
# DAVE (Discord voice, davey -> openmls -> hpke-rs) uses libcrux crates that pin hax-lib =0.3.6; libsignal's own, newer
# libcrux crates want hax-lib ^0.3.7, and cargo keeps one hax-lib per 0.3 series. hax-lib is proof annotations only, so the
# four older crates are vendored (vendor/libcrux-*, unchanged but for that one line, "=0.3.6" -> ">=0.3.6, <0.4").
libcrux-intrinsics-0-0-6 = { path = "vendor/libcrux-intrinsics-0.0.6", package = "libcrux-intrinsics" }
libcrux-ml-kem-0-0-8 = { path = "vendor/libcrux-ml-kem-0.0.8", package = "libcrux-ml-kem" }
libcrux-secrets-0-0-5 = { path = "vendor/libcrux-secrets-0.0.5", package = "libcrux-secrets" }
libcrux-sha3-0-0-8 = { path = "vendor/libcrux-sha3-0.0.8", package = "libcrux-sha3" }
core-models-0-0-5 = { path = "vendor/core-models-0.0.5", package = "core-models" }
# libsignal builds against Signal's own curve25519-dalek (extra functions it calls); a patch is global, so every other
# crate here that uses dalek (Tor, Matrix) gets the fork too - same version number, checked by the build.
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

# The service layer under presage, patched so an account's connections can be routed through Tor or a SOCKS5 proxy and
# carry moho's own user agent: see vendor/libsignal-service-rs/PATCHED.md.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service-rs" }
# presage itself, patched so the link previews it fetches when sending follow the account's route and the person's
# setting: see vendor/presage/PATCHED.md.
[patch."https://github.com/whisperfish/presage"]
presage = { path = "vendor/presage" }

[dev-dependencies]
tempfile = "3"

# Local debug builds keep line numbers for backtraces and not the full debug
# information, which made each one several times the size of the program. A
# release build, which is what ships, is not affected.
[profile.dev]
debug = "line-tables-only"
